# DeltaEdit - LLaMA-3-8B-Instruct - AutoDL Cloud
# Note: layers must have last element duplicated for noise detection.

alg_name: "DeltaEdit"
model_name: "/root/autodl-tmp/Meta-Llama-3-8B-Instruct"
stats_dir: "/root/autodl-tmp/stats"
device: 0
layers: [4, 5, 6, 7, 8, 8]
layer_selection: "all"
fact_token: "subject_last"
v_num_grad_steps: 25
v_lr: 1e-1
v_loss_layer: 31
v_weight_decay: 0.5
clamp_norm_factor: 0.75
kl_factor: 0.0625
mom2_adjustment: true
mom2_update_weight: 15000
rewrite_module_tmp: "model.layers.{}.mlp.down_proj"
layer_module_tmp: "model.layers.{}"
mlp_module_tmp: "model.layers.{}.mlp"
attn_module_tmp: "model.layers.{}.self_attn"
ln_f_module: "model.norm"
lm_head_module: "lm_head"
mom2_dataset: "wikipedia"
mom2_n_samples: 100000
mom2_dtype: "float32"
nullspace_threshold: 2e-2
L2: 10
solve_method: "alphaedit"
var: 1.5
space: 0.25
noise_warmup: 5
