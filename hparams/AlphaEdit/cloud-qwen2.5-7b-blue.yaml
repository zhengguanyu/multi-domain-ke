# AlphaEdit + BLUE enhancement - Qwen2.5-7B-Instruct - AutoDL Cloud
# Per-layer z computation, no residual division, fewer layers, lower L2

alg_name: "AlphaEdit"
model_name: "/root/autodl-tmp/Qwen2.5-7B-Instruct"
stats_dir: "/root/autodl-tmp/stats"
P_loc: "./null_space_project_qwen2.5-7b.pt"
device: 0
layers: [4, 8]
clamp_norm_factor: 4
layer_selection: "all"
fact_token: "subject_last"
v_num_grad_steps: 25
v_lr: 5e-1
v_loss_layer: 27
v_weight_decay: 1e-3
kl_factor: 0.0625
mom2_adjustment: true
mom2_update_weight: 15000
rewrite_module_tmp: "model.layers.{}.mlp.down_proj"
layer_module_tmp: "model.layers.{}"
mlp_module_tmp: "model.layers.{}.mlp"
attn_module_tmp: "model.layers.{}.self_attn"
ln_f_module: "model.norm"
lm_head_module: "lm_head"
mom2_dataset: "wikipedia"
mom2_n_samples: 100000
mom2_dtype: "float32"
nullspace_threshold: 2e-2
L2: 1
blue: true
