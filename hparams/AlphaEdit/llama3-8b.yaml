alg_name: "AlphaEdit"
model_name: "<path_to_Meta-Llama-3-8B-Instruct>"
stats_dir: "stats"
# Make sure that the projection matrix P has been downloaded from the baidu netdisk (For details, please refer to the EasyEdit/easyeditor/models/alphaedit/README.md) beforehand to avoid double computation.
# But if the projection matrix P which we provided is not needed, then nothing needs to be done to the P_loc field;
# just run the program, and the program will compute P and save it locally automatically.
P_loc: "./null_space_project_llama3-8b.pt"
device: 0
layers: [<layer>, <layer>, <layer>, <layer>, <layer>]
clamp_norm_factor: <clamp_norm_factor>
layer_selection: "all"
fact_token: "subject_last"
v_num_grad_steps: <v_num_grad_steps>
v_lr: <v_lr>
v_loss_layer: <v_loss_layer>
v_weight_decay: <v_weight_decay>
kl_factor: <kl_factor>
mom2_adjustment: true
mom2_update_weight: <mom2_update_weight>
rewrite_module_tmp: "model.layers.{}.mlp.down_proj"
layer_module_tmp: "model.layers.{}"
mlp_module_tmp: "model.layers.{}.mlp"
attn_module_tmp: "model.layers.{}.self_attn"
ln_f_module: "model.norm"
lm_head_module: "lm_head"
mom2_dataset: "wikipedia"
mom2_n_samples: <mom2_n_samples>
mom2_dtype: "float32"
nullspace_threshold: <nullspace_threshold>
L2: <L2>
